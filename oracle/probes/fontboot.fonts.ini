; fontboot recorded with [fonts] lines that are not names of the system
; directory: a path elsewhere, a name with no extension, a name alone, and
; a file that is not there. The file elsewhere is EGA80WOA.FON copied there
; before Windows starts.
[fonts]
WB Elsewhere (Set #1)=C:\FONTS\TERM.FON
WB No Extension (Set #2)=CGA80WOA
WB Searched (Set #3)=EGA40WOA.FON
WB Missing (Set #4)=C:\FONTS\NONE.FON
[oracle copy]
C:\FONTS\TERM.FON=C:\WINDOWS\SYSTEM\EGA80WOA.FON
