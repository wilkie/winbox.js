default:
  image: node:22

stages:
  - check
  - test

variables:
  # Keep the pnpm store inside the project so GitLab can cache it.
  PNPM_STORE: '$CI_PROJECT_DIR/.pnpm-store'

.node:
  before_script:
    - corepack enable pnpm
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

# Lint and typecheck the TypeScript: the page and the scripts. The engine is
# Rust, and its checks (cargo fmt, clippy, cargo test) need a Rust toolchain
# this image does not have; so do `pnpm build` and the browser tests, which
# build the engine for WebAssembly first.
check:
  extends: .node
  stage: check
  script:
    - pnpm lint
    - pnpm typecheck

# The page's unit tests, the scripts' and the knowledge base's.
test:
  extends: .node
  stage: test
  script:
    - pnpm test
