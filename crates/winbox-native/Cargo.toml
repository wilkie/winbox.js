[package]
name = "winbox-native"
description = "winbox.js's Windows 3.1 run natively, in a window of the host's"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
winbox-machine.workspace = true
winbox-ne.workspace = true
winbox-win16.workspace = true
winit = "0.30"
softbuffer = "0.4"
cpal = "0.18"
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Seamless mode's calls winit has none for (`host_os.rs`): the version winit
# itself uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
