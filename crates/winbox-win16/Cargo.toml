[package]
name = "winbox-win16"
description = "Windows 3.1 itself, in Rust: programs loaded and linked, and the modules they call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
winbox-cpu.workspace = true
winbox-machine.workspace = true
winbox-ne.workspace = true
winbox-opl.workspace = true
winbox-raster.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The paging audit's test alone (`kb/guides/paging.md`, "The audit").
audit = ["winbox-machine/audit"]

[dev-dependencies]
libtest-mimic = "0.8.2"
png = "0.18"

[lints]
workspace = true

[[test]]
name = "conformance"
harness = false
